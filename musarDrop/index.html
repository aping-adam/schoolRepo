<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musor drop</title>
    <link rel="stylesheet" href="/musarDrop/style.css">
</head>
<body>
    <audio id="musarAudio" loop>
        <source src="/musarDrop/musarDrop.mp3">
    </audio>
    <header>
        <img id="headerImg" src="/musarDrop/img/image.png">
        <h1 id="headerH1">Musar Drop</h1>
    </header>
    <div id="popUp">
        <p id="ageText">Výtej na <b>Musar drop</b> <br> království beden<br>
            ovšem potřebujeme tvůj věk, kolik ti je?</p>
        <input id="ageInput" type="number">
        <button id="ageSubmit">Potvrdit věk</button>
    </div>
    <div id="blur"></div>
    <div id="wholePage">
        <div>
            <p id="headerText">Nejlepší trading/cases stránka <br> <b>EVER</b></p>
        </div>
        <div id="ratingTrustHolder">
            <div id="rating">
                <img id="avatar" src="/musarDrop/img/babicka.png">
                <p id="grannyName">Babička Jiřička</p>
                <p id="grannyText">"neilepsí točki co sem kdy zažila a nebojte husbandovi jakoja ukrást všechny peňaze a vijebat je na bednickach"</p>
                <p id="grannyRating">hodnocení dropu - 10/10</p>
            </div>
            <div id="trustPilot">
                <img src="/musarDrop/img/trustpilot.png">
            </div>
        </div>
    </div>
</body>
<script src="/musarDrop/script.js"></script>
</html>
